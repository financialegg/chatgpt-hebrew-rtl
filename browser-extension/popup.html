<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hebrew RTL</title>
  <style>
    body { font-family: Arial, sans-serif; min-width: 260px; margin: 16px; direction: rtl; }
    h1 { font-size: 17px; margin: 0 0 12px; }
    label { display: block; margin: 10px 0; }
    select { width: 100%; padding: 6px; margin-top: 5px; }
    .row { display: flex; gap: 8px; align-items: center; }
    .note { font-size: 12px; opacity: .72; margin-top: 12px; line-height: 1.45; }
  </style>
</head>
<body>
  <h1>Hebrew RTL</h1>
  <label>
    מצב תצוגה
    <select id="mode">
      <option value="smart">חכם</option>
      <option value="force">RTL כפוי</option>
      <option value="off">כבוי</option>
    </select>
  </label>
  <label class="row"><input type="checkbox" id="tables"><span>תקן טבלאות</span></label>
  <label class="row"><input type="checkbox" id="composer"><span>תקן את שדה הכתיבה</span></label>
  <div class="note">המצב החכם משאיר קוד, נוסחאות וטקסט אנגלי משמאל לימין.</div>
  <script src="popup.js"></script>
</body>
</html>
