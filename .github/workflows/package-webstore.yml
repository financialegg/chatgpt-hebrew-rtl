name: Package Chrome Web Store

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "browser-extension/**"
      - ".github/workflows/package-webstore.yml"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('browser-extension/manifest.json','utf8')); console.log('manifest ok')"
      - name: Build ZIP
        run: |
          cd browser-extension
          zip -r ../chatgpt-hebrew-rtl-webstore.zip . -x "*.DS_Store"
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-web-store-package
          path: chatgpt-hebrew-rtl-webstore.zip
          if-no-files-found: error
