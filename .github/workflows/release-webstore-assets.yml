name: Publish Web Store Release Assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-webstore-assets.yml"
      - "scripts/generate-store-assets.py"
      - "browser-extension/**"

permissions:
  contents: write

jobs:
  release-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install asset dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core
          python -m pip install --upgrade pip
          python -m pip install pillow

      - name: Generate store assets and package icons
        run: python scripts/generate-store-assets.py

      - name: Build Chrome Web Store ZIP
        run: |
          cd browser-extension
          zip -r ../chatgpt-hebrew-rtl-webstore.zip . -x "*.DS_Store"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.1 >/dev/null 2>&1; then
            gh release upload v0.2.1               chatgpt-hebrew-rtl-webstore.zip               store-assets/screenshot-1280x800.png               store-assets/promo-440x280.png               store-assets/marquee-1400x560.png               --clobber
          else
            gh release create v0.2.1               chatgpt-hebrew-rtl-webstore.zip               store-assets/screenshot-1280x800.png               store-assets/promo-440x280.png               store-assets/marquee-1400x560.png               --title "v0.2.1 Chrome Web Store package"               --notes "Chrome Web Store-ready package and listing assets for Hebrew RTL for ChatGPT."
          fi
